name: release Windows desktop (Avalonia UI)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
    tags:
      - '[0-9]*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      target: windows

  release-zip:
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
    needs: build
    uses: ./.github/workflows/package-zip.yml
    with:
      target: windows-desktop
      release_tag: ${{ case(inputs.release_tag != '', inputs.release_tag, github.ref_name) }}
    secrets: inherit
